# Verify, build and deploy ANVIL to GitHub Pages.
# Any failing step (type check, unit tests, browser tests, build) stops the run before deploy.
name: Deploy ANVIL to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (from package-lock.json)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests (builds served at /anvil/ and /)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Build for GitHub Pages
        # A custom domain (public/CNAME, copied into the build) or a <user>.github.io repository
        # is served from /; otherwise a project site lives under /<repository>/.
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -s public/CNAME || "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "Building with base path $BASE"
          npx vite build --base="$BASE"
          test -f dist/index.html
          if [[ -s public/CNAME ]]; then cmp public/CNAME dist/CNAME; fi

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
